# A normal node_modules folder (Tauri's and Vite's tooling expects one), not Plug'n'Play.
nodeLinker: node-modules

# Yarn's supply-chain protections stay on (migrating from npm had switched them off): no
# dependency may run install scripts (none needs one), none may come from a git repository,
# and versions published only moments ago are held back (Yarn's default age gate).
enableScripts: false
