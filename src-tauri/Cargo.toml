[package]
name = "ferret"
version.workspace = true
description = "Ferret file manager"
authors.workspace = true
edition.workspace = true
# A second binary (ferret-indexer) lives in src/bin; keep `cargo run` / `tauri dev` on the app.
default-run = "ferret"

# The app is two crates: ferret-core (everything that isn't UI, no tauri) and this one, the Tauri
# shell: the window, the commands the page calls (src/cmd), the fs:// and thumb:// schemes.
[workspace]
members = ["ferret-core"]
# Built on their own: the WSL helper by ferret-core's build.rs, the vendored crate as a patch.
exclude = ["wsl-size", "vendor"]

# One version for both crates (scripts/release.sh bumps the first `version = ` line: this one).
# The search service compares it (CARGO_PKG_VERSION) between the app and the installed indexer.
[workspace.package]
version = "0.10.6"
authors = ["Ferret"]
edition = "2024"

[lib]
name = "ferret_lib"
# Desktop only: the template's staticlib/cdylib are for mobile and cost a full extra
# optimized link (plus a ~190 MB .lib) on every release build.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ferret-core = { path = "ferret-core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
window-vibrancy = "0.8"
mime_guess = "2"
percent-encoding = "2"
tauri-plugin-drag = "2"
tauri-plugin-dialog = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# --- self-update (GitHub Releases) ---
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# --- diagnostics (rotating log files in the app's log folder) ---
tauri-plugin-log = "2"
log = "0.4"

[target.'cfg(windows)'.dependencies]
# window.rs (the window's big icon), filedrop.rs (the drop target)
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
# filedrop.rs: the #[implement] macro expands to `::windows_core::…` paths.
windows-core = "0.62"
# filedrop.rs: `drag::dragging` (the vendored copy below; tauri-plugin-drag uses the same crate).
drag = "2.1"

[profile.release]
# Thin LTO with parallel codegen: most of fat LTO's gain at a fraction of the build time.
lto = "thin"
opt-level = 3
# No panic = "abort": jobs catch panics so a bug fails one operation, not the app.
strip = true

# drag 2.1.1 panics on the main thread for files on network/WSL shares (canonicalize
# gives a \\?\UNC\ path the shell rejects, then unwrap). Patched copy; see "Ferret patch".
[patch.crates-io]
drag = { path = "vendor/drag" }
